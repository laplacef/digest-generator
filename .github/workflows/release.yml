name: Release

# Tagging vX.Y.Z builds the distributions, publishes them to PyPI via OIDC
# trusted publishing, and cuts a GitHub Release with the changelog entry.
# A pre-release tag (vX.Y.Z-rc.N, -beta.N, -alpha.N) takes the same path and
# lands on GitHub as a pre-release; PyPI flags it as one from its version.
#
# Trusted publishing setup (one-time, no API token needed):
#   1. On PyPI, add a trusted publisher for project "digest-generator":
#      owner=laplacef, repo=digest-generator, workflow=release.yml,
#      environment=pypi.
#   2. On GitHub, create an environment named "pypi" (optionally with
#      required reviewers) so the publish step is gated.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3 # exact pin: upstream ships no floating major tags
        with:
          enable-cache: true

      - name: Verify tag matches package version
        run: |
          # The tag is SemVer and pyproject.toml is PEP 440, so a pre-release
          # tag maps across before comparing: 0.4.0-rc.1 becomes 0.4.0rc1.
          tag=$(printf '%s\n' "${GITHUB_REF_NAME#v}" \
            | sed -E 's/-alpha\.([0-9]+)$/a\1/; s/-beta\.([0-9]+)$/b\1/; s/-rc\.([0-9]+)$/rc\1/')
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag) does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Pinned to a commit: this job holds the OIDC token that publishes to PyPI.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: Create GitHub Release
    # Waits for the upload, so a failed publish leaves no GitHub release behind.
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Pass the tag through the environment (never interpolate ${{ }} into a
    # run: script body — a tag may legally contain shell metacharacters).
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract changelog entry
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md \
            "${prerelease[@]}" \
            dist/*
